server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # woff2 fonts are content-hashed by Vite — safe to cache hard.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA: любой маршрут отдаёт index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
