  <style>

    .compare-label{font-size:12px;color:var(--muted);font-weight:700;background:#fafbf9}.option-head{min-height:168px}.option-head.preferred{background:var(--stage)}.option-name{font-size:23px;font-weight:700;margin-top:8px}.option-price{font-size:29px;font-weight:700;margin-top:16px}.delta{font-size:12px;color:var(--green);margin-top:4px}
    .bar{height:8px;display:flex;margin-top:10px}.bar span:nth-child(1){background:#d4c7ab}.bar span:nth-child(2){background:#c88c6c}.bar span:nth-child(3){background:#6f756f}

    .field-section{margin-top:16px}.field-section-head{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line-strong);padding-bottom:7px}.field-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-bottom:1px solid var(--line)}.field{padding:12px 12px 14px 0;min-height:83px}.field dt{font-size:11px;color:var(--muted)}.field dd{font-size:18px;font-weight:700;margin-top:5px}.field .source{margin-top:6px}

<body>
  <main id="app" aria-label="VO-T1 high-fidelity target"></main>
  <script>
    const NNBSP=' ';
    const q=(value)=>new URLSearchParams(location.search).get(value);
    const target=q('target')||'opportunities';
