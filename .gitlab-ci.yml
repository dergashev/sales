# Managed by inari. Bootstrap pipeline following the sample-project convention.
include:
  - project: "devops/gitlab-ci-cd-shared/shared"
    file: "versioning.yaml"
    ref: "master"

default:
  image: docker.core.funkflow.com/alpine-git-executioner:0.0.39

stages:
  - get_version
  - build_docker
  - argo_tagging

mr:
  stage: get_version
  extends:
    - .mr

release:
  stage: get_version
  extends:
    - .release

build_docker:
  stage: build_docker
  script:
    - echo $VERSION
    - docker login -u $DOCKER_REGISTRY_USERNAME -p $DOCKER_REGISTRY_PASSWORD ${DOCKER_REGISTRY}
    # Image name is rendered by inari from the project PATH — the same literal
    # it seeds into the argo values. Never derived from CI_PROJECT_TITLE: the
    # human title drifts from the path (spaces → underscores) and breaks both
    # the pushed image name and the update_argo_tag lookup.
    - IMAGE="docker.core.funkflow.com/vibe-apps_sales-configurator:${VERSION}"
    - docker build -t "$IMAGE" -f ./Dockerfile .
    - docker push "$IMAGE"
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

update_argo_tag:
  stage: argo_tagging
  variables:
    ARGO_REPO: ebf/vibe-apps/sales-configurator-argo.git
  script:
    - IMAGE_BACKEND="docker.core.funkflow.com/vibe-apps_sales-configurator"
    - git clone https://${RELEASE_BOT_USER}:${RELEASE_BOT_TOKEN}@${CI_SERVER_HOST}/${ARGO_REPO} argo-deploy
    - cd argo-deploy
    - git config user.name "$RELEASE_BOT_USER"
    - git config user.email "${RELEASE_BOT_USER}@funkflow.com"
    - git config http.sslverify "false"
    - 'VALUES_FILE=$(grep -rl "image: ${IMAGE_BACKEND}$" apps/ 2>/dev/null | head -1)'
    - '[ -n "$VALUES_FILE" ] || { echo "ERROR: values file not found for ${IMAGE_BACKEND}"; exit 1; }'
    # Forward-only write. This job used to put whatever $VERSION its own pipeline
    # carried into values.yaml without ever looking at what was already there, so
    # re-running an OLD pipeline rewound production's desired state and went green:
    # 2026-09-05T09:05:54Z, "ci(argo-tag) sales-configurator 1.0.52" over 1.0.57
    # (incident REL-RECOVERY-02). The guard refuses a non-forward move and leaves
    # the file untouched; ARGO_TAG_ALLOW_ROLLBACK=1 permits a deliberate rollback.
    - echo "Updating $VALUES_FILE to $VERSION"
    - sh "${CI_PROJECT_DIR}/tools/ci/argo-tag-guard.sh" "$VALUES_FILE" "$IMAGE_BACKEND" "$VERSION"
    - git diff
    - 'if git diff --quiet -- "$VALUES_FILE"; then echo "argo-tag: desired state unchanged - nothing to commit"; exit 0; fi'
    - git add "$VALUES_FILE"
    - git commit -m "ci(argo-tag) sales-configurator ${VERSION}"
    - git push origin master
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
